name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gorelo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Offline test suite
        run: uv run --frozen --with pytest --with anyio python -m pytest -q -p no:cacheprovider

  deploy:
    name: Deploy checked main to PROD
    needs: pytest
    if: >-
      github.repository == 'jeffaul/GoreloMCP' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions: {}

    concurrency:
      group: gorelo-prod-deployment
      cancel-in-progress: false

    steps:
      - name: Update and restart PROD
        env:
          DEPLOY_URL: ${{ secrets.PROD_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_URL" || -z "$DEPLOY_TOKEN" ]]; then
            echo "::error::Missing PROD_DEPLOY_URL or PROD_DEPLOY_TOKEN in repository secrets."
            exit 1
          fi

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          echo "Tests passed. Requesting PROD deployment..."

          if ! status=$(curl --silent --show-error \
            --proto '=https' \
            --connect-timeout 15 \
            --max-time 320 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --request POST "$DEPLOY_URL"); then
            echo "::error::Could not confirm deployment. Check PROD logs before retrying."
            exit 1
          fi

          if [[ "$status" != "200" ]] ||
             ! grep -qx 'Deployment completed successfully' "$response_file"; then
            echo "::error::PROD did not confirm a successful deployment. HTTP status: $status. Check the tunnel and PROD deployment logs."
            exit 1
          fi

          echo "PROD confirmed that deployment completed successfully."
          echo "### PROD deployment completed successfully" >> "$GITHUB_STEP_SUMMARY"
